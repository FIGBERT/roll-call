[project]
name = "MorningSummary"
version = "0.1.0"
description = "A daily paper printout of digital information"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "applescript>=2021.2.9",
    "bleprinter>=0.2.0",
    "caldav>=1.4.0",
    "icalendar>=6.0.1",
    "imessage-reader",
    "oura-ring>=0.3.0",
    "python-dotenv>=1.0.1",
    "python-escpos[usb]>=3.1",
    "requests>=2.32.3",
    "things-py>=0.0.15",
]

[project.scripts]
morningsummary = "morningsummary:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
imessage-reader = { git = "https://github.com/figbert/imessage_reader.git" }

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "C901", "I"]
